[project]
name = "dasen-skills"
version = "0.1.0a1"
description = "Original Skills for sourced Chinese content production"
requires-python = ">=3.10"
dependencies = [
  "packaging>=26,<27",
  "PyYAML>=6.0,<7",
  "markdown-it-py>=4.0,<5",
  "Pygments>=2.19,<3",
  "Pillow>=11,<13",
  "tzdata>=2025.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["skills", "tests"]
