schema_version: 3
public_subset:
  status: candidate
  license: MIT
  skills:
  - dasen-content
  - dasen-research
  - dasen-writing
  - dasen-knowledge
  - dasen-visual
  - dasen-wechat
  excludes:
  - dasen-video
  distribution_files:
  - LICENSE
  - THIRD_PARTY.md
  - ORIGIN.md
  - README.md
  - README.en.md
  - INSTALL.md
  - requirements.txt
  - prepare-macos.sh
  - docs/zh-CN/installation.md
  - docs/zh-CN/compatibility.md
  - docs/zh-CN/updating.md
  - docs/en/installation.md
  - docs/en/compatibility.md
  - docs/en/updating.md
