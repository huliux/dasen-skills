    - aihot
  content-wechat:
    skills:
    - dasen-content
    - dasen-research
    - dasen-writing
    - dasen-knowledge
    - dasen-visual
    - dasen-wechat
    external_tools:
    - python>=3.10
    - PyYAML
    - markdown-it-py
    - Pygments
    - wechat-official-account-api
    optional_skills:
    - agent-reach
    - aihot
  knowledge:
    skills:
    - dasen-content
    - dasen-knowledge
    external_tools:
    - python>=3.10
    - PyYAML
    optional_skills:
