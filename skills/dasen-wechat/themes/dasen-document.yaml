  h2: 'margin:1.6em 0 0.55em;padding:0 0 0.35em;font-size:21px;line-height:1.4;font-weight:650;color:#252525;border-bottom:1px solid #e4e4e4;'
  h3: margin:1.3em 0 0.45em;font-size:18px;line-height:1.45;font-weight:650;color:#333333;
  h4: margin:1.1em 0 0.35em;font-size:1.1em;line-height:1.4;font-weight:650;color:#222222;
