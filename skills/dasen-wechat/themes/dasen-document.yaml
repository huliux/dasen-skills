  table: width:100%;max-width:100%;margin:1.4em auto;border-collapse:collapse;table-layout:fixed;font-size:14px;
  th: 'padding:7px 8px;border:1px solid #d8d8d8;background-color:#ffffff;font-weight:650;line-height:1.5;text-align:left;vertical-align:top;word-break:break-word;'
  td: 'padding:7px 8px;border:1px solid #d8d8d8;background-color:#ffffff;line-height:1.5;text-align:left;vertical-align:top;word-break:break-word;'
