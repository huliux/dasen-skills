schema_version: 1
id: dasen-default
description: Dasen 原创的微信公众号正文基线，强调移动端可读性和无装饰信息层级。
legacy_aliases: []
styles:
  root: "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;font-size:16px;line-height:1.6;color:#222222;background-color:#ffffff;letter-spacing:0.034em;word-break:break-word;"
  p: "margin:1em 0;line-height:1.6;"
  h1: "margin:1.2em 0 0.6em;font-size:1.7em;line-height:1.25;font-weight:650;color:#222222;"
  h2: "margin:1.35em 0 0.45em;font-size:1.602em;line-height:1.3;font-weight:600;color:#222222;"
  h3: "margin:1.2em 0 0.4em;font-size:1.25em;line-height:1.35;font-weight:650;color:#222222;"
  h4: "margin:1.1em 0 0.35em;font-size:1.1em;line-height:1.4;font-weight:650;color:#222222;"
  h5: "margin:1em 0 0.35em;font-size:1em;line-height:1.4;font-weight:650;color:#222222;"
  h6: "margin:1em 0 0.35em;font-size:1em;line-height:1.4;font-weight:650;color:#595959;"
  strong: "font-weight:600;color:#222222;"
  em: "font-style:italic;"
  a: "color:#0069c2;text-decoration:none;border-bottom:1px solid #b8d8f0;word-break:break-all;"
  img: "display:block;max-width:100%;height:auto;margin:2em auto;border:0;border-radius:0;box-shadow:none;"
  ul: "margin:1em 0;padding-left:1.4em;line-height:1.75;"
  ol: "margin:1em 0;padding-left:1.4em;line-height:1.75;"
  li: "margin:0.35em 0;line-height:1.75;"
  blockquote: "margin:1.2em 0;padding:0.65em 1em;border-left:3px solid #c9cdd4;background-color:#f7f8fa;color:#595959;"
  table: "width:100%;max-width:100%;margin:1.4em auto;border-collapse:collapse;table-layout:fixed;font-size:14px;"
  th: "padding:8px 9px;border:1px solid #d8d8d8;background-color:#f5f6f7;color:#222222;font-weight:650;line-height:1.5;text-align:left;vertical-align:top;word-break:break-word;"
  td: "padding:8px 9px;border:1px solid #d8d8d8;color:#222222;line-height:1.5;text-align:left;vertical-align:top;word-break:break-word;"
  hr: "height:0;margin:3em 0;border:0;border-top:1px solid #e0e0e0;"
  code: "font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:0.9em;background-color:#f3f4f6;color:#333333;border-radius:3px;padding:0.12em 0.3em;"
  pre: "margin:1.5em 0;padding:1em;overflow-x:auto;background-color:#f7f7f8;color:#2f3337;line-height:1.65;white-space:pre;word-break:normal;"
  code_container: "margin:1.5em 0;border:1px solid #e3e5e8;border-radius:6px;overflow:hidden;background-color:#f7f7f8;"
  code_toolbar: "height:24px;padding:0 10px;background-color:#eceef1;line-height:24px;"
  code_dot: "display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;vertical-align:middle;"
  figure: "margin:2em 0;text-align:center;"
  figcaption: "margin-top:-1.2em;color:#888888;font-size:13px;line-height:1.5;text-align:center;"
