# Adapted from the user-selected MWeb theme; see NOTICE.md for attribution and licenses.
schema_version: 1
id: dasen-default
description: MWeb Bear · supplied default palette and Bear layout
legacy_aliases:
- mweb-bear
styles:
  root_first: "margin-top:0;"
  img: max-width:100%;height:auto;border:0;
  figure: margin:0.75em 0;text-align:center;
  figcaption: margin:8px 0 0;font-size:14px;line-height:1.5;font-weight:400;color:#999999;text-align:center;
  em: font-style:italic;
  ul: margin:0.75em 0 0.45em 1.3em;padding:0;list-style-type:disc;
  ol: margin:0.75em 0 0.45em 1.3em;padding:0;list-style-type:decimal;
  li: margin:0.25em 0 0;
  nested_ul: margin:0.25em 0 0 2em;list-style-type:circle;
  nested_ol: margin:0.25em 0 0 2em;
  blockquote_p: margin:0;
  code_toolbar: display:none;
  pre_code: font-family:inherit;font-size:inherit;line-height:inherit;tab-size:4;
  sub: font-size:75%;vertical-align:sub;line-height:0;
  sup: font-size:75%;vertical-align:super;line-height:0;
  root: box-sizing:border-box;max-width:838.4px;margin:0 auto;padding:25.6px 51.2px;font-family:AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:16px;line-height:1.6;color:#222222;background-color:#ffffff;word-wrap:break-word;
  p: margin:0.75em 0 0.45em;line-height:1.6;
  strong: font-weight:bold;
  a: color:#2478c5;text-decoration:none;word-break:break-word;
  blockquote: 'margin:0.75em 0 0.45em;padding:0 0 0 0.8em;border-left:0.2em solid #353535;'
  del: color:#525252;
  mark: color:inherit;display:inline;padding:0.2em 0.5em;background-color:#fcffc0;
  table: max-width:100%;margin:0.75em 0 0.45em;border-collapse:collapse;border-spacing:0;font-size:1em;background-color:#ffffff;
  hr: 'height:1px;margin:0.75em auto;border:1px inset #bfbfbf;background-color:#bfbfbf;'
  code: 'font-family:Menlo-Regular,Menlo,Monaco,Consolas,''Courier New'',monospace;font-size:0.9em;color:#424242;background-color:#ffffff;border:1px solid #bfbfbf;padding:0.2em 0.5em;'
  code_container: margin:0.75em 0 0.45em;
  pre: 'margin:0;padding:0.7em 1em;font-family:Menlo-Regular,Menlo,Monaco,Consolas,''Courier New'',monospace;font-size:14.4px;line-height:24px;overflow-x:auto;border:1px solid #bfbfbf;color:#424242;background-color:#ffffff;white-space:pre;word-break:normal;'
  th: 'padding:0.7em 1em;font-size:0.9em;border:1px solid #bfbfbf;text-align:left;font-weight:normal;vertical-align:middle;'
  td: 'padding:0.7em 1em;font-size:0.9em;border:1px solid #bfbfbf;text-align:left;font-weight:normal;vertical-align:middle;'
  h1: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1.5em;font-weight:500;line-height:1.5;color:#262626;
  h2: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1.3em;font-weight:500;line-height:1.5;color:#262626;
  h3: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1.1em;font-weight:500;line-height:1.5;color:#262626;
  h4: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1em;font-weight:500;line-height:1.5;color:#262626;
  h5: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1em;font-weight:500;line-height:1.5;color:#262626;
  h6: margin:1.5em 0 0.75em;font-family:'AvenirNext-Medium',AvenirNext-Regular,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'PingFang SC',sans-serif;font-size:1em;font-weight:500;line-height:1.5;color:#262626;
  syntax_keyword: color:#2478c5;
  syntax_comment: color:#575757;
  syntax_number: color:#0b5d83;
  syntax_string: color:#b43d15;
  syntax_attribute: color:#950980;
  syntax_operator: color:#920448;
  syntax_function: color:#0e73a2;
  syntax_variable: color:#0e73a2;
  syntax_tag: color:#1b00ce;
  figure_img: display:block;margin-left:auto;margin-right:auto;
  figcaption_p: margin:0;font-size:inherit;line-height:inherit;color:inherit;text-align:center;
  figcaption_a: font-size:inherit;color:inherit;
  figcaption_strong: font-size:inherit;color:inherit;
